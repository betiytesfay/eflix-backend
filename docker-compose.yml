services:
  mongodb:
    image: mongo:7-jammy
    container_name: eflix-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    container_name: eflix-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URL=mongodb://mongodb:27017/eflix
      - JWT_SECRET=super_secret_jwt_key_eflix_prod_2026
      - CORS_ORIGIN=*
    depends_on:
      - mongodb

volumes:
  mongo-data:
