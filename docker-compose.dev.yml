services:
  # ─── INFRASTRUCTURE ──────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: eflix-mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eflix-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

  # ─── MICROSERVICES ───────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: user-service
    container_name: eflix-user-dev
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - USER_SERVICE_PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/eflix
      - RABBITMQ_URL=amqp://rabbitmq:5672
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
      - rabbitmq

  movie-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: movie-service
    container_name: eflix-movie-dev
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=development
      - MOVIE_SERVICE_PORT=5002
      - MONGO_URI=mongodb://mongodb:27017/eflix
      - RABBITMQ_URL=amqp://rabbitmq:5672
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
      - rabbitmq

  subscription-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: subscription-service
    container_name: eflix-subscription-dev
    ports:
      - "5003:5003"
      - "50051:50051"
    environment:
      - NODE_ENV=development
      - SUBSCRIPTION_SERVICE_PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/eflix
      - RABBITMQ_URL=amqp://rabbitmq:5672
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
      - rabbitmq

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: notification-service
    container_name: eflix-notification-dev
    environment:
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://rabbitmq:5672
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - rabbitmq

volumes:
  mongo-dev-data:
